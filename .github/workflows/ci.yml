name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
  # Redeploys main, for when only the production Environment in 1Password
  # changed and there is no commit to push.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, bcmath, pdo_sqlite
          coverage: none

      - run: composer install --no-interaction --no-progress --prefer-dist

      - run: cp .env.example .env && php artisan key:generate

      - run: vendor/bin/pint --test

      - run: php artisan test

  # One native runner per platform. Under QEMU the arm64 half compiled intl
  # from source for the better part of the build; natively it takes a minute.
  # Each pushes its image by digest only, and `image` below tags the pair.
  image-platform:
    # Published from main and from version tags; every other push only tests.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: tests
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Name the image and platform
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          platform='${{ matrix.platform }}'
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Scoped per platform, or the two runners overwrite each other's cache.
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Export the digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combines the two platform images into one multi-platform image and gives it
  # the tags; nothing is built here.
  image:
    needs: image-platform
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Name the image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=sha,format=long,prefix=

      - name: Tag the multi-platform image
        working-directory: ${{ runner.temp }}/digests
        run: |
          # Split on purpose: one -t per tag, one argument per digest.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"

  # Ships main to the caddy-proxy host, the way headless-form does: the compose
  # file and .env go to /opt/patchbay and the stack is pulled and brought up
  # there. The .env is read from a 1Password Environment, so it is edited in
  # 1Password and nowhere else. Only this repository deploys; a fork's main has
  # neither the host nor the secrets.
  deploy:
    if: github.repository == 'RobertBoes/patchbay-server' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: deploy
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6

      # `op environment` is only in the beta CLI so far. Pinned, so a later
      # beta cannot change what a deploy does; move to the stable release, or
      # 1password/load-secrets-action, once the command reaches it.
      - name: Install 1Password CLI
        env:
          OP_VERSION: v2.40.0-beta.02
        run: |
          curl -fsSLo op.zip "https://cache.agilebits.com/dist/1P/op2/pkg/${OP_VERSION}/op_linux_amd64_${OP_VERSION}.zip"
          unzip -q op.zip op -d "$RUNNER_TEMP/op"
          echo "$RUNNER_TEMP/op" >> "$GITHUB_PATH"

      # Checked before anything reaches the server: an empty read, or one that
      # came back with 1Password's placeholder instead of a value, fails here
      # and the running stack keeps its current .env.
      - name: Read the production Environment
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          OP_ENVIRONMENT_ID: ${{ vars.OP_ENVIRONMENT_ID }}
        run: |
          op environment read "$OP_ENVIRONMENT_ID" > .env.deploy
          grep -q '^APP_KEY=.' .env.deploy || { echo "The Environment has no APP_KEY; refusing to deploy." >&2; exit 1; }
          if grep -qi 'concealed' .env.deploy; then
            echo "The Environment came back masked; refusing to deploy." >&2
            exit 1
          fi
          # Pinned to this commit's image rather than latest, so what runs is
          # what was just tested and built, and rerunning an old deploy rolls back.
          printf '\nPATCHBAY_IMAGE=ghcr.io/%s:%s\n' "${GITHUB_REPOSITORY,,}" "$GITHUB_SHA" >> .env.deploy

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Ship compose file and env
        run: |
          scp -i ~/.ssh/deploy_key docker-compose.production.yml \
            deploy@${{ secrets.DEPLOY_HOST }}:/opt/patchbay/docker-compose.yml
          scp -i ~/.ssh/deploy_key .env.deploy \
            deploy@${{ secrets.DEPLOY_HOST }}:/opt/patchbay/.env
          rm .env.deploy

      # A plain recreate: the dashboard migrates as it starts and the other
      # services wait for it to be healthy. Caddy holds web requests through
      # the gap; WebSocket clients are dropped and reconnect on their own.
      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.DEPLOY_HOST }} bash -s <<'EOF'
            set -euo pipefail
            # Logged out however this ends, so a failed pull or an unhealthy
            # container does not leave the token in the deploy user's config.
            trap 'docker logout ghcr.io >/dev/null' EXIT
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /opt/patchbay
            # Every secret the app has is in here; scp leaves it world-readable.
            chmod 600 .env
            docker compose pull -q
            docker compose up -d --wait --wait-timeout 180 --remove-orphans
          EOF
