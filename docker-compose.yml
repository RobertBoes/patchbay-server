# Patchbay on your own machine, with HTTPS, in one command:
#
#   docker compose up -d
#
# Dashboard: https://patchbay.localhost   WebSockets: wss://ws.patchbay.localhost
# Both resolve to this machine without a hosts file. Trust Caddy's local CA
# once (README, "Running it locally with Docker") or the browser will refuse
# the WebSocket connection. Port 443 taken, by Valet or Herd say? Set
# PATCHBAY_HTTPS_PORT=8443 and add :8443 to both addresses.
#
# This is for trying Patchbay out, not for production: the APP_KEY below is
# public. docker-compose.production.yml is the deployable one.

x-app: &app
  build:
    context: .
    # Temporary, until the package is on Packagist (see the Dockerfile).
    additional_contexts:
      patchbay: ../patchbay
  image: patchbay-server:local
  restart: unless-stopped
  stop_signal: SIGTERM
  environment: &env
    APP_ENV: local
    APP_DEBUG: "true"
    # Local only. Anyone can read it here; never deploy with it.
    APP_KEY: base64:cGF0Y2hiYXktbG9jYWwtZGV2ZWxvcG1lbnQta2V5ISE=
    APP_URL: https://patchbay.localhost:${PATCHBAY_HTTPS_PORT:-443}
    LOG_CHANNEL: stderr
    DB_CONNECTION: pgsql
    DB_HOST: pgsql
    DB_DATABASE: patchbay
    DB_USERNAME: patchbay
    DB_PASSWORD: patchbay
    SESSION_DRIVER: database
    QUEUE_CONNECTION: database
    CACHE_STORE: database
    MAIL_MAILER: log
    REVERB_PROVIDER: patchbay
    REVERB_SERVER_HOST: 0.0.0.0
    REVERB_SERVER_PORT: "8080"
    REVERB_HOST: ws.patchbay.localhost
    REVERB_PORT: ${PATCHBAY_HTTPS_PORT:-443}
    REVERB_SCHEME: https
    PATCHBAY_SERVER_URL: http://reverb:8080
    PATCHBAY_RELOAD_INTERVAL: "2"
    DASHBOARD_DOMAIN: patchbay.localhost
    DASHBOARD_ADMINS: ${PATCHBAY_ADMIN_EMAIL:-}
    DASHBOARD_LANDING_METRICS: "true"
    TRUSTED_PROXIES: "*"
  depends_on:
    pgsql:
      condition: service_healthy

services:
  app:
    <<: *app
    environment:
      <<: *env
      AUTORUN_ENABLED: "true"
      AUTORUN_LARAVEL_MIGRATION: "true"

  reverb:
    <<: *app
    command: ["php", "/var/www/html/artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    environment:
      <<: *env
      AUTORUN_ENABLED: "false"
    healthcheck:
      test: ["CMD", "healthcheck-reverb"]
      interval: 30s
      start_period: 10s

  queue:
    <<: *app
    command: ["php", "/var/www/html/artisan", "queue:work", "--tries=3"]
    environment:
      <<: *env
      AUTORUN_ENABLED: "false"
    healthcheck:
      test: ["CMD", "healthcheck-queue"]
      interval: 30s
      start_period: 10s

  scheduler:
    <<: *app
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    environment:
      <<: *env
      AUTORUN_ENABLED: "false"
    healthcheck:
      test: ["CMD", "healthcheck-schedule"]
      interval: 60s
      start_period: 10s

  pgsql:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: patchbay
      POSTGRES_USER: patchbay
      POSTGRES_PASSWORD: patchbay
    volumes:
      - pgsql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patchbay -d patchbay"]
      interval: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${PATCHBAY_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/caddy/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app
      - reverb

volumes:
  pgsql_data:
  caddy_data:
